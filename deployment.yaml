apiVersion: apps/v1
kind: Deployment
metadata:
  name: python-microservice
  namespace: local-app
  labels:
    app: python-microservice
spec:
  replicas: 2
  selector:
    matchLabels:
      app: python-microservice
  template:
    metadata:
      labels:
        app: python-microservice
    spec:
      containers:
        - name: app
          image: localhost:5000/python-microservice:1
          ports:
            - containerPort: 8000
          readinessProbe:
            httpGet: { path: /health, port: 8000 }